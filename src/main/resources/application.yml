server:
  port: 8087
  servlet:
    context-path: "/grocery-tracker"

spring:
  application:
    name: grocery-tracker

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true

  data:
    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 30s
    socket-timeout: 30000

logging:
  level:
    org.springframework.data.elasticsearch: INFO
